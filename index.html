<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ariiadinn - Simulasi Ujian CPNS/Sekolah Kedinasan</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col min-h-screen antialiased selection:bg-brand-500 selection:text-white"
      x-data="appData()" 
      x-init="initApp()">

  <!-- HEADER & NAVIGATION -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo / Title -->
      <div class="flex items-center gap-3 cursor-pointer" @click="goToHome()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i data-lucide="award" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white tracking-wide">
            ariiadinn
          </h1>
          <p class="text-xs text-slate-400 font-medium">Simulasi Ujian CPNS/Sekolah Kedinasan</p>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-3">
        <template x-if="currentView !== 'admin' && currentView !== 'quiz'">
          <button @click="openAdminAuthModal()" 
                  class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-600/50 text-sm font-medium transition-all">
            <i data-lucide="lock" class="w-4 h-4 text-brand-500"></i>
            <span>Panel Admin</span>
          </button>
        </template>

        <template x-if="currentView === 'admin'">
          <button @click="goToHome()" 
                  class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium transition-all">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span>Keluar Admin</span>
          </button>
        </template>
      </div>

    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

    <!-- VIEW 1: HOME / QUIZ SELECTION -->
    <template x-if="currentView === 'home'">
      <div class="space-y-8 animate-fadeIn">
        
        <!-- Hero Banner -->
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-slate-800 via-slate-800/90 to-slate-900 border border-slate-700/60 p-6 sm:p-8 shadow-xl">
          <div class="relative z-10 max-w-2xl">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs font-semibold mb-4">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
              <span>Platform Ujian Online Interactive</span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mb-2">
              Persiapkan Diri Anda Menuju CPNS & Kedinasan
            </h2>
            <p class="text-slate-400 text-sm sm:text-base leading-relaxed">
              Pilih paket kuis di bawah ini untuk memulai latihan. Setiap soal memiliki timer 50 detik secara independen.
            </p>
          </div>
          <!-- Decorative SVG -->
          <div class="absolute -right-10 -bottom-10 opacity-10 pointer-events-none">
            <i data-lucide="file-check" class="w-80 h-80 text-brand-500"></i>
          </div>
        </div>

        <!-- Quiz List Grid -->
        <div>
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              <i data-lucide="book-open" class="w-5 h-5 text-brand-500"></i>
              <span>Daftar Paket Simulasi Kuis</span>
            </h3>
            <span class="text-xs text-slate-400" x-text="`${quizzes.length} Paket Tersedia`"></span>
          </div>

          <!-- Empty State -->
          <template x-if="quizzes.length === 0">
            <div class="bg-slate-800/40 border-2 border-dashed border-slate-700/80 rounded-2xl p-12 text-center max-w-lg mx-auto">
              <div class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center mx-auto mb-4 border border-slate-700 text-slate-400">
                <i data-lucide="inbox" class="w-8 h-8"></i>
              </div>
              <h4 class="text-base font-bold text-white mb-1">Belum Ada Kuis Tersedia</h4>
              <p class="text-slate-400 text-sm mb-6">
                Soal default telah dikosongkan. Silakan tambahkan kuis baru melalui Panel Admin untuk memulai simulasi.
              </p>
              <button @click="openAdminAuthModal()" 
                      class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition-all shadow-lg shadow-brand-600/20">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Tambah Kuis di Panel Admin</span>
              </button>
            </div>
          </template>

          <!-- Grid Cards -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <template x-for="quiz in quizzes" :key="quiz.id">
              <div class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/70 hover:border-brand-500/50 rounded-2xl p-5 flex flex-col justify-between transition-all group shadow-lg">
                <div>
                  <div class="flex items-start justify-between gap-3 mb-3">
                    <span class="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider"
                          :class="{
                            'bg-blue-500/10 text-blue-400 border border-blue-500/20': quiz.category === 'TWK',
                            'bg-purple-500/10 text-purple-400 border border-purple-500/20': quiz.category === 'TIU',
                            'bg-amber-500/10 text-amber-400 border border-amber-500/20': quiz.category === 'TKP',
                            'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20': !['TWK','TIU','TKP'].includes(quiz.category)
                          }"
                          x-text="quiz.category || 'CPNS'">
                    </span>
                    <span class="text-xs text-slate-400 flex items-center gap-1">
                      <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                      <span x-text="`${quiz.questions.length} Soal`"></span>
                    </span>
                  </div>

                  <h4 class="font-bold text-white text-lg group-hover:text-brand-400 transition-colors mb-2" x-text="quiz.title"></h4>
                  <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed mb-4" x-text="quiz.description || 'Simulasi kuis CPNS & Kedinasan.'"></p>
                </div>

                <div class="pt-4 border-t border-slate-700/50 flex items-center justify-between">
                  <div class="text-xs text-slate-400 flex items-center gap-1">
                    <i data-lucide="timer" class="w-3.5 h-3.5 text-brand-400"></i>
                    <span>50s / Soal</span>
                  </div>
                  <button @click="startQuizRegistration(quiz)" 
                          class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs flex items-center gap-1.5 transition-all shadow-md shadow-brand-600/20">
                    <span>Kerjakan</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

      </div>
    </template>

    <!-- VIEW 2: REGISTRATION FORM VIEW -->
    <template x-if="currentView === 'register'">
      <div class="max-w-md mx-auto my-8 animate-fadeIn">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl">
          
          <button @click="goToHome()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 mb-6 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Kembali ke pilihan kuis</span>
          </button>

          <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="user-check" class="w-6 h-6"></i>
            </div>
            <h3 class="text-xl font-bold text-white">Registrasi Peserta</h3>
            <p class="text-xs text-slate-400 mt-1" x-text="`Kuis: ${selectedQuiz?.title}`"></p>
          </div>

          <form @submit.prevent="submitRegistration()" class="space-y-4">
            <!-- Nama Lengkap -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
              <div class="relative">
                <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" 
                       x-model="participant.name" 
                       required 
                       placeholder="Masukkan Nama Lengkap Anda"
                       class="w-full bg-slate-900 border border-slate-700 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition-all">
              </div>
            </div>

            <!-- Asal Kabupaten/Kota -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Asal Kabupaten/Kota</label>
              <div class="relative">
                <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" 
                       x-model="participant.location" 
                       required 
                       placeholder="Contoh: Kab. Tulungagung / Kota Jakarta"
                       class="w-full bg-slate-900 border border-slate-700 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition-all">
              </div>
            </div>

            <button type="submit" 
                    class="w-full mt-6 py-3 rounded-xl bg-gradient-to-r from-brand-600 to-emerald-500 hover:from-brand-500 hover:to-emerald-400 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-brand-600/30 transition-all">
              <span>Mulai Ujian</span>
              <i data-lucide="play" class="w-4 h-4 fill-current"></i>
            </button>
          </form>

        </div>
      </div>
    </template>

    <!-- VIEW 3: QUIZ RUNNER INTERFACE -->
    <template x-if="currentView === 'quiz' && activeQuiz">
      <div class="max-w-4xl mx-auto space-y-6 animate-fadeIn">
        
        <!-- Top Status Bar -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4 shadow-xl">
          <div>
            <span class="text-xs font-semibold text-brand-400 uppercase tracking-wider" x-text="activeQuiz.category"></span>
            <h3 class="font-bold text-white text-base sm:text-lg" x-text="activeQuiz.title"></h3>
            <p class="text-xs text-slate-400" x-text="`Peserta: ${participant.name} (${participant.location})`"></p>
          </div>

          <!-- Timer & Progress Counter -->
          <div class="flex items-center gap-4">
            <!-- Soal Count -->
            <div class="bg-slate-900/80 px-3.5 py-2 rounded-xl border border-slate-700 text-center">
              <span class="block text-[10px] text-slate-400 uppercase font-semibold">Nomor Soal</span>
              <span class="text-sm font-extrabold text-white" x-text="`${currentQuestionIndex + 1} / ${activeQuiz.questions.length}`"></span>
            </div>

            <!-- 50-Second Countdown Timer -->
            <div class="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2.5"
                 :class="{'border-red-500/50 bg-red-950/20': timer <= 10}">
              <i data-lucide="clock" class="w-5 h-5" :class="timer <= 10 ? 'text-red-400 animate-pulse' : 'text-amber-400'"></i>
              <div>
                <span class="block text-[10px] text-slate-400 uppercase font-semibold">Sisa Waktu</span>
                <span class="text-base font-mono font-extrabold" :class="timer <= 10 ? 'text-red-400' : 'text-amber-400'" x-text="`${timer} Detik`"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Question Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl relative">
          
          <!-- Question Title & Text -->
          <div class="mb-6">
            <div class="flex items-center justify-between mb-3">
              <span class="px-2.5 py-1 rounded-md bg-slate-700 text-slate-300 text-xs font-bold" x-text="`Soal #${currentQuestionIndex + 1}`"></span>
            </div>
            
            <p class="text-base sm:text-lg text-slate-100 font-medium leading-relaxed whitespace-pre-line" x-text="currentQuestion.text"></p>

            <!-- Question Image Attachment -->
            <template x-if="currentQuestion.image">
              <div class="mt-4 rounded-xl overflow-hidden border border-slate-700 bg-slate-900/50 p-2 max-w-lg">
                <img :src="currentQuestion.image" alt="Lampiran Soal" class="w-full max-h-80 object-contain rounded-lg">
              </div>
            </template>
          </div>

          <!-- Options List (A, B, C, D, E) -->
          <div class="space-y-3 mb-8">
            <template x-for="(opt, key) in currentQuestion.options" :key="key">
              <button @click="selectAnswer(key)" 
                      class="w-full text-left p-4 rounded-xl border transition-all flex items-start gap-4 group"
                      :class="userAnswers[currentQuestionIndex] === key 
                        ? 'bg-brand-500/10 border-brand-500 text-white shadow-md shadow-brand-500/10' 
                        : 'bg-slate-900/60 border-slate-700/80 hover:border-slate-500 text-slate-200'">
                
                <span class="w-8 h-8 rounded-lg shrink-0 flex items-center justify-center font-bold text-sm transition-all"
                      :class="userAnswers[currentQuestionIndex] === key 
                        ? 'bg-brand-500 text-white' 
                        : 'bg-slate-800 text-slate-400 group-hover:bg-slate-700 group-hover:text-slate-200'"
                      x-text="key.toUpperCase()">
                </span>

                <div class="flex-1 pt-1">
                  <div class="text-sm font-medium leading-relaxed" x-text="opt.text || ''"></div>
                  <!-- Option Image -->
                  <template x-if="opt.image">
                    <img :src="opt.image" alt="Lampiran Opsi" class="mt-2 max-h-48 object-contain rounded-lg border border-slate-700">
                  </template>
                </div>
              </button>
            </template>
          </div>

          <!-- Navigation Action Buttons -->
          <div class="flex items-center justify-between pt-6 border-t border-slate-700/80">
            <button @click="prevQuestion()" 
                    :disabled="currentQuestionIndex === 0"
                    class="px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:pointer-events-none text-slate-200 font-semibold text-xs flex items-center gap-2 transition-all">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
              <span>Sebelumnya</span>
            </button>

            <template x-if="currentQuestionIndex < activeQuiz.questions.length - 1">
              <button @click="nextQuestion()" 
                      class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs flex items-center gap-2 transition-all shadow-md shadow-brand-600/20">
                <span>Selanjutnya</span>
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </template>

            <template x-if="currentQuestionIndex === activeQuiz.questions.length - 1">
              <button @click="finishQuiz()" 
                      class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-2 transition-all shadow-lg shadow-emerald-600/20">
                <i data-lucide="check-circle" class="w-4 h-4"></i>
                <span>Selesaikan Ujian</span>
              </button>
            </template>
          </div>

        </div>
      </div>
    </template>

    <!-- VIEW 4: QUIZ RESULT VIEW -->
    <template x-if="currentView === 'result' && examResult">
      <div class="max-w-3xl mx-auto space-y-8 animate-fadeIn">
        
        <!-- Score Overview Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 text-center shadow-2xl relative overflow-hidden">
          <div class="w-16 h-16 rounded-2xl bg-brand-500/10 border border-brand-500/20 text-brand-400 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="trophy" class="w-8 h-8"></i>
          </div>

          <h2 class="text-2xl font-extrabold text-white">Hasil Ujian Simulasi</h2>
          <p class="text-sm text-slate-400 mt-1" x-text="`${examResult.participantName} (${examResult.participantLocation})`"></p>

          <!-- Score Display -->
          <div class="my-6 py-6 border-y border-slate-700/80 max-w-sm mx-auto">
            <span class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Skor Murni</span>
            <div class="text-5xl font-extrabold text-brand-400 tracking-tight" x-text="`${examResult.scorePercentage}%`"></div>
            <p class="text-xs text-slate-400 mt-2" x-text="`Jawaban Benar: ${examResult.correctAnswers} dari ${examResult.totalQuestions} Soal`"></p>
          </div>

          <!-- Actions -->
          <div class="flex flex-wrap items-center justify-center gap-4">
            <button @click="goToHome()" 
                    class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold text-xs flex items-center gap-2 transition-all">
              <i data-lucide="home" class="w-4 h-4"></i>
              <span>Halaman Utama</span>
            </button>
            <button @click="showReview = !showReview" 
                    class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs flex items-center gap-2 transition-all shadow-md shadow-brand-600/20">
              <i data-lucide="file-text" class="w-4 h-4"></i>
              <span x-text="showReview ? 'Sembunyikan Pembahasan' : 'Lihat Pembahasan'"></span>
            </button>
          </div>
        </div>

        <!-- YouTube Video Discussion Embed (If available) -->
        <template x-if="examResult.quizYoutubeUrl">
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h3 class="text-base font-bold text-white flex items-center gap-2 mb-4">
              <i data-lucide="youtube" class="w-5 h-5 text-red-500"></i>
              <span>Video Pembahasan Soal</span>
            </h3>
            <div class="aspect-video w-full rounded-xl overflow-hidden bg-black">
              <iframe :src="getYoutubeEmbedUrl(examResult.quizYoutubeUrl)" 
                      class="w-full h-full border-0" 
                      allowfullscreen></iframe>
            </div>
          </div>
        </template>

        <!-- Detailed Review Section -->
        <div x-show="showReview" class="space-y-4">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="check-square" class="w-5 h-5 text-brand-400"></i>
            <span>Detail Lembar Jawaban & Pembahasan</span>
          </h3>

          <template x-for="(q, idx) in examResult.questions" :key="idx">
            <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-6 space-y-4">
              
              <div class="flex items-start justify-between gap-3">
                <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-700 text-slate-300" x-text="`Soal #${idx + 1}`"></span>
                <span class="px-3 py-1 rounded-full text-xs font-bold"
                      :class="examResult.userAnswers[idx] === q.correctKey ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'"
                      x-text="examResult.userAnswers[idx] === q.correctKey ? 'BENAR' : 'SALAH'">
                </span>
              </div>

              <p class="text-sm text-slate-200 font-medium whitespace-pre-line" x-text="q.text"></p>

              <!-- Question Image -->
              <template x-if="q.image">
                <img :src="q.image" alt="Lampiran Soal" class="max-h-48 rounded-lg border border-slate-700">
              </template>

              <!-- Option Review -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                <template x-for="(opt, k) in q.options" :key="k">
                  <div class="p-3 rounded-xl border flex items-center justify-between gap-2"
                       :class="{
                         'bg-emerald-500/10 border-emerald-500/60 text-emerald-300 font-bold': k === q.correctKey,
                         'bg-red-500/10 border-red-500/60 text-red-300 font-bold': k === examResult.userAnswers[idx] && k !== q.correctKey,
                         'bg-slate-900/40 border-slate-700/60 text-slate-400': k !== q.correctKey && k !== examResult.userAnswers[idx]
                       }">
                    <span><strong x-text="`${k.toUpperCase()}.`"></strong> <span x-text="opt.text || ''"></span></span>
                    <span x-if="k === q.correctKey" class="text-[10px] uppercase font-bold text-emerald-400">(Kunci)</span>
                  </div>
                </template>
              </div>

              <!-- Explanation Text -->
              <template x-if="q.explanation">
                <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 text-xs text-slate-300">
                  <strong class="text-brand-400 block mb-1">Pembahasan:</strong>
                  <p x-text="q.explanation"></p>
                </div>
              </template>

            </div>
          </template>
        </div>

      </div>
    </template>

    <!-- VIEW 5: ADMIN PANEL VIEW -->
    <template x-if="currentView === 'admin'">
      <div class="space-y-6 animate-fadeIn">
        
        <!-- Admin Sub-Header / Nav Tabs -->

  <!-- ALPINE.JS LOGIC SCRIPT -->
  <script>
    function appData() {
      return {
        // App Navigation & Views: 'home', 'register', 'quiz', 'result', 'admin'
        currentView: 'home',
        adminTab: 'rekap', // 'rekap', 'quizzes', 'settings'

        // Data Storage
        quizzes: [],
        results: [],
        adminPasswordHash: 'admin123', // Initial Password (stored and changeable in localStorage)

        // Selected State
        selectedQuiz: null,
        activeQuiz: null,
        currentQuestionIndex: 0,
        userAnswers: {},
        timer: 50,
        timerInterval: null,

        // Participant Data
        participant: {
          name: '',
          location: ''
        },

        // Exam Result State
        examResult: null,
        showReview: false,

        // Admin Modals & Auth State
        showAdminAuthModal: false,
        inputPassword: '',
        authError: '',
        showQuizEditorModal: false,
        searchQuery: '',
        newPassword: '',
        confirmPassword: '',

        // Quiz Editor Temp Form
        editingQuiz: {
          id: null,
          title: '',
          category: 'TWK',
          description: '',
          youtubeUrl: '',
          questions: []
        },

        // Init App & Load LocalStorage
        initApp() {
          this.loadStorage();
          this.$watch('quizzes', () => this.saveQuizzesToStorage());
          this.$watch('results', () => this.saveResultsToStorage());
          
          // Initialize Lucide icons
          this.$nextTick(() => {
            if (window.lucide) lucide.createIcons();
          });
        },

        // LocalStorage Helpers
        loadStorage() {
          const savedQuizzes = localStorage.getItem('ariiadinn_quizzes');
          this.quizzes = savedQuizzes ? JSON.parse(savedQuizzes) : [];

          const savedResults = localStorage.getItem('ariiadinn_results');
          this.results = savedResults ? JSON.parse(savedResults) : [];

          const savedPass = localStorage.getItem('ariiadinn_admin_pass');
          if (savedPass) this.adminPasswordHash = savedPass;
        },

        saveQuizzesToStorage() {
          localStorage.setItem('ariiadinn_quizzes', JSON.stringify(this.quizzes));
        },

        saveResultsToStorage() {
          localStorage.setItem('ariiadinn_results', JSON.stringify(this.results));
        },

        // Navigation Actions
        goToHome() {
          this.stopTimer();
          this.currentView = 'home';
          this.refreshIcons();
        },

        refreshIcons() {
          this.$nextTick(() => {
            if (window.lucide) lucide.createIcons();
          });
        },

        // Participant Flow
        startQuizRegistration(quiz) {
          this.selectedQuiz = quiz;
          this.participant.name = '';
          this.participant.location = '';
          this.currentView = 'register';
          this.refreshIcons();
        },

        submitRegistration() {
          if (!this.participant.name || !this.participant.location) return;
          this.startQuiz(this.selectedQuiz);
        },

        startQuiz(quiz) {
          this.activeQuiz = JSON.parse(JSON.stringify(quiz));
          this.currentQuestionIndex = 0;
          this.userAnswers = {};
          this.currentView = 'quiz';
          this.startTimerForQuestion();
          this.refreshIcons();
        },

        get currentQuestion() {
          return this.activeQuiz?.questions[this.currentQuestionIndex] || {};
        },

        selectAnswer(key) {
          this.userAnswers[this.currentQuestionIndex] = key;
        },

        // Timer Logic (50 seconds per question)
        startTimerForQuestion() {
          this.stopTimer();
          this.timer = 50;
          this.timerInterval = setInterval(() => {
            if (this.timer > 0) {
              this.timer--;
            } else {
              // Timer expired: auto advance to next or finish
              this.handleTimeExpired();
            }
          }, 1000);
        },

        stopTimer() {
          if (this.timerInterval) clearInterval(this.timerInterval);
        },

        handleTimeExpired() {
          if (this.currentQuestionIndex < this.activeQuiz.questions.length - 1) {
            this.nextQuestion();
          } else {
            this.finishQuiz();
          }
        },

        nextQuestion() {
          if (this.currentQuestionIndex < this.activeQuiz.questions.length - 1) {
            this.currentQuestionIndex++;
            this.startTimerForQuestion();
          }
        },

        prevQuestion() {
          if (this.currentQuestionIndex > 0) {
            this.currentQuestionIndex--;
            this.startTimerForQuestion();
          }
        },

        finishQuiz() {
          this.stopTimer();
          
          // Calculate score
          let correctCount = 0;
          const questions = this.activeQuiz.questions;
          
          questions.forEach((q, idx) => {
            if (this.userAnswers[idx] === q.correctKey) {
              correctCount++;
            }
          });

          const totalQuestions = questions.length;
          const scorePercentage = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;

          // Build result record
          const resultData = {
            id: Date.now(),
            date: new Date().toLocaleString('id-ID'),
            participantName: this.participant.name,
            participantLocation: this.participant.location,
            quizTitle: this.activeQuiz.title,
            quizCategory: this.activeQuiz.category,
            quizYoutubeUrl: this.activeQuiz.youtubeUrl,
            correctAnswers: correctCount,
            totalQuestions: totalQuestions,
            scorePercentage: scorePercentage,
            userAnswers: { ...this.userAnswers },
            questions: questions
          };

          this.results.unshift(resultData);
          this.examResult = resultData;
          this.showReview = false;
          this.currentView = 'result';
          this.refreshIcons();
        },

        // Admin Auth Logic
        openAdminAuthModal() {
          this.inputPassword = '';
          this.authError = '';
          this.showAdminAuthModal = true;
          this.refreshIcons();
        },

        verifyAdminPassword() {
          if (this.inputPassword === this.adminPasswordHash) {
            this.showAdminAuthModal = false;
            this.currentView = 'admin';
            this.refreshIcons();
          } else {
            this.authError = 'Password admin salah. Akses ditolak.';
          }
        },

        // Admin Actions & Tab Filter
        get filteredResults() {
          if (!this.searchQuery) return this.results;
          const q = this.searchQuery.toLowerCase();
          return this.results.filter(r => 
            r.participantName.toLowerCase().includes(q) || 
            r.participantLocation.toLowerCase().includes(q) ||
            r.quizTitle.toLowerCase().includes(q)
          );
        },

        deleteResult(id) {
          this.results = this.results.filter(r => r.id !== id);
        },

        exportResultsToCSV() {
          if (this.results.length === 0) {
            alert('Belum ada data rekap nilai untuk di-export.');
            return;
          }

          let csvContent = "data:text/csv;charset=utf-8,";
          csvContent += "No,Waktu,Nama Peserta,Asal Kabupaten/Kota,Judul Kuis,Skor (%),Jawaban Benar,Total Soal\n";

          this.results.forEach((r, index) => {
            const row = [
              index + 1,
              `"${r.date}"`,
              `"${r.participantName}"`,
              `"${r.participantLocation}"`,
              `"${r.quizTitle}"`,
              r.scorePercentage,
              r.correctAnswers,
              r.totalQuestions
            ].join(",");
            csvContent += row + "\n";
          });

          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `Rekap_Nilai_ariiadinn_${Date.now()}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        },

        // Quiz Builder Logic
        openQuizEditor(quizToEdit = null) {
          if (quizToEdit) {
            this.editingQuiz = JSON.parse(JSON.stringify(quizToEdit));
          } else {
            this.editingQuiz = {
              id: null,
              title: '',
              category: 'TWK',
              description: '',
              youtubeUrl: '',
              questions: [this.createBlankQuestion()]
            };
          }
          this.showQuizEditorModal = true;
          this.refreshIcons();
        },

        createBlankQuestion() {
          return {
            text: '',
            image: '',
            options: {
              a: { text: '', image: '' },
              b: { text: '', image: '' },
              c: { text: '', image: '' },
              d: { text: '', image: '' },
              e: { text: '', image: '' }
            },
            correctKey: 'a',
            explanation: ''
          };
        },

        addNewQuestionToQuiz() {
          this.editingQuiz.questions.push(this.createBlankQuestion());
        },

        removeQuestionFromQuiz(idx) {
          this.editingQuiz.questions.splice(idx, 1);
        },

        handleFileUpload(event, questionObj) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              questionObj.image = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        },

        saveQuiz() {
          if (!this.editingQuiz.title) return;

          if (this.editingQuiz.id) {
            // Update Existing
            const index = this.quizzes.findIndex(q => q.id === this.editingQuiz.id);
            if (index !== -1) {
              this.quizzes[index] = JSON.parse(JSON.stringify(this.editingQuiz));
            }
          } else {
            // Create New
            this.editingQuiz.id = Date.now();
            this.quizzes.push(JSON.parse(JSON.stringify(this.editingQuiz)));
          }

          this.showQuizEditorModal = false;
          this.refreshIcons();
        },

        deleteQuiz(id) {
          this.quizzes = this.quizzes.filter(q => q.id !== id);
        },

        // Settings Actions
        changeAdminPassword() {
          if (this.newPassword !== this.confirmPassword) {
            alert('Konfirmasi password tidak cocok.');
            return;
          }
          if (!this.newPassword) return;

          this.adminPasswordHash = this.newPassword;
          localStorage.setItem('ariiadinn_admin_pass', this.newPassword);
          this.newPassword = '';
          this.confirmPassword = '';
          alert('Password admin berhasil diperbarui.');
        },

        exportDatabaseJSON() {
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
            quizzes: this.quizzes,
            results: this.results
          }, null, 2));
          const dlAnchorElem = document.createElement('a');
          dlAnchorElem.setAttribute("href", dataStr);
          dlAnchorElem.setAttribute("download", `Backup_ariiadinn_${Date.now()}.json`);
          dlAnchorElem.click();
        },

        resetAllData() {
          if (confirm('Apakah Anda yakin ingin menghapus seluruh data kuis dan rekap nilai?')) {
            localStorage.clear();
            this.quizzes = [];
            this.results = [];
            this.adminPasswordHash = 'admin123';
            alert('Data berhasil dibersihkan.');
          }
        },

        getYoutubeEmbedUrl(url) {
          if (!url) return '';
          const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
          const match = url.match(regExp);
          return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : url;
        }

      };
    }
  </script>
</body>
</html>
